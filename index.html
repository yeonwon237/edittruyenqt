<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <!-- maximum-scale=1, user-scalable=no: stop accidental pinch/double-tap
         zoom while scrolling long chapter text on mobile. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#7c3aed" />
    <link rel="manifest" href="/manifest.json" />
    <!-- "Add to Home Screen" on iOS ignores manifest.json's display mode —
         these are the separate meta tags Safari actually reads to launch
         standalone (no address bar) instead of opening in-browser. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Edit QT" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Noto Serif: subtitle burn-in preview font on the Tạo Video/Phụ Đề
         cover canvas (src/lib/subtitles.js) — chosen over a more decorative
         display font specifically for guaranteed full Vietnamese diacritic
         glyph coverage. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet" />
    <title>Trợ Lý Dịch Thuật & Edit QT</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
